# Свежий релиз своего же пакета pnpm по умолчанию не пускает: политика требует,
# чтобы версии было хотя бы сутки от роду. Здесь это не защита от чужого
# скомпрометированного релиза, а собственный пакет, который мы сами и выпускаем,
# поэтому исключаем его по имени.
minimumReleaseAgeExclude:
  - smooth-stream-text
