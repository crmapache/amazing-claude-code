# The two JavaScript halves of this repository. They are deliberately separate packages rather than one:
#
#   webview - the panel's interface, the phone client and the harness. Elastic-2.0, like the plugin.
#   relay   - the little server that introduces an IDE to a phone. Apache-2.0, and meant to become a
#             repository of its own (see relay/README.md): the plugin's licence forbids offering the
#             software to others as a hosted service, and a component whose whole purpose is to be
#             hosted cannot ship under it.
#
# A workspace rather than two unrelated folders so that one `pnpm install` at the root sets up both, and
# `pnpm -r build` / `pnpm -r test` cover the whole repository - the state a person cloning this expects.
# Nothing is shared between the packages: splitting the relay out means moving the folder, not untangling
# it.
packages:
  - webview
  - relay
