webview.unsupported.title=Embedded browser is unavailable
webview.unsupported.text=This IDE runtime has no JCEF support, so the Claude panel cannot render. Switch to the JetBrains Runtime with JCEF and restart the IDE.
webview.stalled.text=<html>The panel's interface did not come up.<br><br>This usually means the plugin was updated while the IDE was running: it cannot take over until the IDE is restarted, and until then the panel has nothing to show.<br><br>If a restart does not help, please report it - the IDE's log (Help | Show Log in Files) says what was not served.</html>
webview.stalled.restart=Restart IDE

claude.notFound.title=Claude Code not found
claude.notFound.text=Could not find the claude executable. Install Claude Code and make sure it is on your PATH.
