# The caption of the button on the side stripe: the key has to match the tool window's id
toolwindow.stripe.AmazingClaudeCode=Amazing Claude Code GUI

# The caption of the notification group in the IDE's settings; its id keeps the old name (see plugin.xml)
notification.group=Amazing Claude Code GUI

webview.unsupported.title=Embedded browser is unavailable
webview.unsupported.text=This IDE runtime has no JCEF support, so the Claude panel cannot render. Switch to the JetBrains Runtime with JCEF and restart the IDE.
webview.stalled.text=<html>The panel's interface did not come up.<br><br>This usually means the plugin was updated while the IDE was running: it cannot take over until the IDE is restarted, and until then the panel has nothing to show.<br><br>If a restart does not help, please report it - the IDE's log (Help | Show Log in Files) says what was not served.</html>
webview.stalled.restart=Restart IDE
webview.stopped.text=<html>The IDE's built-in browser has stopped, and this panel is drawn by it.<br><br>This is a bug in the IDE itself: now and then it shuts its own browser down, and everything the browser draws goes blank at once, this panel and Markdown previews alike. Only a restart of the IDE brings it back.<br><br>Your tabs and drafts come back after the restart. A turn that is running now will be cut off by it.</html>
webview.stopped.restart=Restart IDE
webview.stopped.issue=The bug in the JetBrains tracker (JBR-10027)
webview.crashed.text=<html>The panel's page keeps crashing: it was brought back several times in the last few minutes and went down again each time.<br><br>Your conversations are safe, they live in the IDE rather than in the page. If building the panel again does not help, restart the IDE; its log (Help | Show Log in Files) says how the page ended.</html>
webview.crashed.reload=Build the panel again

claude.notFound.title=Claude Code not found
claude.notFound.text=Could not find the claude executable. Install Claude Code and make sure it is on your PATH.
