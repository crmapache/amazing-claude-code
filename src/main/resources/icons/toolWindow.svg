<!-- Монограмма ACC: три буквы идут по диагонали сверху слева вниз направо и
     слегка находят друг на друга — так все три помещаются в квадрат значка и
     читаются как один знак, а не как строчка мелкого текста. Буквы предельно
     простые (галочка с перекладиной и две дуги): на 20 пикселях любая деталь
     сложнее превращается в грязь.

     Лучи расходятся веером от середины знака — по три в каждую сторону.
     Середина веера смотрит поперёк монограммы (вверх-вправо и вниз-влево),
     боковые лучи разведены от неё на 25°, поэтому сияние читается именно как
     исходящее от букв, а не как штриховка рядом с ними. Толщина у лучей вдвое
     меньше буквенной: на равной они спорили бы со знаком, а не подсвечивали его.

     Цвет обводки один на буквы и лучи — значок монохромный, платформа
     перекрашивает его целиком под тему New UI. -->
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g stroke="#6C707E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1.8 9.6 5.2 2.0 8.6 9.6"/>
    <path d="M3.1 7.0H7.3"/>
    <path d="M13.0 7.8A3.4 3.4 0 1 0 13.0 12.6"/>
    <path d="M17.2 12.0A3.4 3.4 0 1 0 17.2 16.8"/>
  </g>
  <g stroke="#6C707E" stroke-width="0.9" stroke-linecap="round">
    <path d="M11.71 5.30 12.53 3.05"/>
    <path d="M13.68 6.32 15.80 4.20"/>
    <path d="M14.70 8.29 16.95 7.47"/>
    <path d="M8.29 14.70 7.47 16.95"/>
    <path d="M6.32 13.68 4.20 15.80"/>
    <path d="M5.30 11.71 3.05 12.53"/>
  </g>
</svg>
