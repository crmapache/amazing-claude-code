<!-- The ACC monogram: three letters run diagonally from the top left down to the right and slightly overlap
     one another - that way all three fit into the icon's square and read as one mark rather than as a line
     of small text. The letters are as simple as they get (a tick with a crossbar and two arcs): at 20
     pixels any finer detail turns into mud.

     The rays fan out from the middle of the mark - three to each side. The fan's middle looks across the
     monogram (up-right and down-left), and the side rays are spread 25 degrees from it, so the glow reads
     as coming out of the letters rather than as hatching beside them. The rays are half the letters'
     thickness: at an equal one they would compete with the mark instead of lighting it up.

     The stroke colour is one for the letters and the rays - the icon is monochrome and the platform
     repaints it whole for the New UI theme. -->
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g stroke="#6C707E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1.8 9.6 5.2 2.0 8.6 9.6"/>
    <path d="M3.1 7.0H7.3"/>
    <path d="M13.0 7.8A3.4 3.4 0 1 0 13.0 12.6"/>
    <path d="M17.2 12.0A3.4 3.4 0 1 0 17.2 16.8"/>
  </g>
  <g stroke="#6C707E" stroke-width="0.9" stroke-linecap="round">
    <path d="M11.71 5.30 12.53 3.05"/>
    <path d="M13.68 6.32 15.80 4.20"/>
    <path d="M14.70 8.29 16.95 7.47"/>
    <path d="M8.29 14.70 7.47 16.95"/>
    <path d="M6.32 13.68 4.20 15.80"/>
    <path d="M5.30 11.71 3.05 12.53"/>
  </g>
</svg>
