group = io.github.crmapache.amazingclaudecode
version = 0.7.5

# Целевая платформа. Собираем против WebStorm, потому что плагин задуман в первую
# очередь для него, и тестовая IDE должна быть именно той, где мы правим интерфейс.
platformType = WS
platformVersion = 2026.2

# Нижняя граница совместимости. Ниже 2026.2 опускать нельзя: обработчик схемы для
# встроенного браузера реализует методы JCEF, которых в прежних сборках просто нет,
# и панель падала бы с NoSuchClassError. Проверено верификатором плагинов.
pluginSinceBuild = 262

# Адрес dev-сервера интерфейса. Пустая строка = грузим собранную статику из архива
# плагина. Заполняется при запуске тестовой IDE через -PwebviewDevUrl=...
webviewDevUrl =

# Kotlin stdlib поставляется самой платформой, свою версию бандлить нельзя.
# https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx2048m
