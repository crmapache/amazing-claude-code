group = io.github.crmapache.amazingclaudecode
version = 0.7.23

# The target platform. We build against WebStorm because the plugin is meant for it first of all, and
# the sandbox IDE has to be the one where the interface is worked on.
platformType = WS
platformVersion = 2026.2

# The lower bound of compatibility. It cannot go below 2026.2: the scheme handler for the embedded
# browser implements JCEF methods that simply do not exist in earlier builds, and the panel would fail
# with NoSuchClassError. Verified with the plugin verifier.
pluginSinceBuild = 262

# The interface dev server's address. An empty string means loading the built assets out of the plugin's
# archive. Filled in when starting the sandbox IDE through -PwebviewDevUrl=...
webviewDevUrl =

# The Kotlin stdlib is shipped by the platform itself; bundling a copy of our own is not allowed.
# https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx2048m
