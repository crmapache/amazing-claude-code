group = io.github.crmapache.amazingclaudecode
version = 0.9.2

# The target platform. We build against WebStorm because the plugin is meant for it first of all, and
# the sandbox IDE has to be the one where the interface is worked on.
platformType = WS
platformVersion = 2026.2

# The lower bound of compatibility. 2026.1 rather than 2026.2 because that is what Android Studio is
# built on - its stable channel (Quail) is a 261 build, and until this bound came down the plugin was
# simply invisible there. One thing stood in the way and it is dealt with rather than worked around: the
# scheme handler for the embedded browser named JCEF types that do not exist before 2026.2 (see
# WebviewResources). Android Studio on top of that carries no embedded browser at all, but the browser is
# an ordinary marketplace plugin there and our dependency on it is required, so the IDE installs it with
# us (see plugin.xml); other 2026.1 IDEs have it already.
# Below 261 we do not go: that is two more releases of API drift, and the current stable Android Studio
# is already here.
pluginSinceBuild = 261

# The interface dev server's address. An empty string means loading the built assets out of the plugin's
# archive. Filled in when starting the sandbox IDE through -PwebviewDevUrl=...
webviewDevUrl =

# The Kotlin stdlib is shipped by the platform itself; bundling a copy of our own is not allowed.
# https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx2048m
